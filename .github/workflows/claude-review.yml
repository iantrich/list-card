name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Dependabot PRs are handled by claude-dependabot.yml; fork PRs get no secrets.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the guidelines in CLAUDE.md
            (.github/copilot-instructions.md). Focus on correctness, editor/card
            config parity, localization keys in both en.json and nb.json, theme
            variable usage, and test coverage for new helpers in src/utils.ts.
            Leave inline comments for specific issues and one short summary
            comment. Do not nitpick formatting that `yarn lint` already covers.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
